apiVersion: v1
kind: Namespace
metadata:
  name: fraud-detection
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fraud-config
  namespace: fraud-detection
data:
  API_ADDR: ":8080"
  KAFKA_BROKERS: "kafka:9092"
  KAFKA_TOPIC: "transactions"
  KAFKA_GROUP_ID: "fraud-detectors"
  REDIS_ADDR: "redis:6379"
  PAYMENT_FAILURES_THRESHOLD: "5"
  PAYMENT_FAILURES_WINDOW: "5m"
  PURCHASES_THRESHOLD: "10"
  PURCHASES_WINDOW: "1m"
  CARD_USERS_THRESHOLD: "3"
  CARD_USERS_WINDOW: "1h"
  IP_USERS_THRESHOLD: "5"
  IP_USERS_WINDOW: "10m"
  HIGH_PURCHASE_AMOUNT: "1000"
---
apiVersion: v1
kind: Secret
metadata:
  name: fraud-secrets
  namespace: fraud-detection
type: Opaque
stringData:
  DATABASE_URL: "postgres://fraud:fraud@postgres:5432/fraud?sslmode=disable"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: detector
  namespace: fraud-detection
spec:
  replicas: 2
  selector:
    matchLabels:
      app: detector
  template:
    metadata:
      labels:
        app: detector
    spec:
      containers:
        - name: detector
          image: fraud-pipeline:latest
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/detector"]
          envFrom:
            - configMapRef:
                name: fraud-config
            - secretRef:
                name: fraud-secrets
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "true"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "true"]
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: fraud-detection
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: fraud-pipeline:latest
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/api"]
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: fraud-config
            - secretRef:
                name: fraud-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: fraud-detection
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8080
      targetPort: 8080

